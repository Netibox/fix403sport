    <title>Open in VLC via Image</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        /* เอฟเฟกต์เวลาเอาเมาส์ไปชี้ที่รูปภาพ ให้ดูเหมือนกดได้ */
        .vlc-img-link img {
            transition: transform 0.2s, opacity 0.2s;
        }
        .vlc-img-link img:hover {
            transform: scale(1.05); /* ขยายรูปใหญ่ขึ้นเล็กน้อย */
